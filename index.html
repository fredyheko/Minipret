<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Pret — demo magazin online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: brand header with logo + store button, yellow marquee, filters, animated grid, store list; product and store picker open as dialogs */
  --bg:#f7f6f1; --surface:#ffffff; --ink:#111111; --muted:#5f5e58; --line:#e6e4dc;
  --accent:#fed400; --accent-ink:#111111; --brand:#111111; --ok:#1d7a46; --ok-bg:#e6f4ea; --no:#b0aea6;
  --display:"Onest",system-ui,sans-serif; --body:"Manrope",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.demo{background:var(--ink);color:#fff;font-size:13px;text-align:center;padding:6px 16px}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:2px}
.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,input[type=text],input[type=tel]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:transparent;padding:7px 11px;cursor:pointer;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:28px}
.hero{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.hero h1{font-family:var(--display);font-size:clamp(24px,4vw,36px);line-height:1.1;margin:0;text-wrap:balance;max-width:20ch}
.hero p{margin:0;color:var(--muted);max-width:44ch}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--accent);border-color:var(--ink)}
.toggle{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--brand)}
.spacer{flex:1}
.count{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0}
.card:hover{border-color:var(--brand)}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--line)}
.card .info{padding:10px 12px 12px;display:grid;gap:4px}
.card .name{font-weight:700}
.price{font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;border:1.5px solid var(--ink);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 7px}
.avail{font-size:13px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.avail.none .dot{background:var(--no)}
.avail.none{color:var(--muted)}
.empty{padding:32px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
h2{font-family:var(--display);font-size:22px;margin:0 0 12px}
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.store{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;font-size:14px}
.store b{font-size:15px}
.store small{color:var(--muted)}
.store.mine{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
dialog{border:0;border-radius:14px;padding:0;max-width:860px;width:calc(100% - 24px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,20,.55)}
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.pd img{width:100%;height:100%;object-fit:cover;display:block;min-height:320px}
.pd .body{padding:20px;display:grid;gap:14px;align-content:start}
.pd h3{font-family:var(--display);font-size:24px;margin:0;line-height:1.15}
.close{position:absolute;right:10px;top:10px;border:0;background:var(--surface);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:20px;line-height:1}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.size{min-width:46px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:700}
.size[aria-pressed="true"]{background:var(--ink);color:var(--accent);border-color:var(--ink)}
.size.out{color:var(--no);text-decoration:line-through}
.where{border:1px solid var(--line);border-radius:10px;max-height:220px;overflow:auto}
.where div{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:14px}
.where div:last-child{border-bottom:0}
.where .mine{background:var(--ok-bg);font-weight:700}
.qty{font-variant-numeric:tabular-nums;color:var(--ok);font-weight:700;white-space:nowrap}
.btn{border:2px solid var(--ink);background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:10px;padding:12px 16px;cursor:pointer;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:13px;color:var(--muted)}
form{display:grid;gap:10px}
.ok{background:var(--ok-bg);color:var(--ink);border-radius:10px;padding:12px;font-size:14px}
footer{max-width:1180px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:13px}
@media (max-width:640px){
  .pd{grid-template-columns:1fr}
  .pd img{min-height:0;aspect-ratio:4/3}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .bar{gap:8px}
  .field{flex:1 1 100%}
}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}

.logo{margin-right:auto;display:block;line-height:0}
.logo img{height:52px;width:auto;display:block}
.storeBtn{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--ink);border-radius:12px;padding:6px 12px;cursor:pointer;text-align:left;min-height:46px}
.storeBtn span{display:grid;line-height:1.2}
.storeBtn small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.storeBtn b{font-size:15px}
.storeBtn:hover{background:var(--accent)}
.storeBtn .chev{transition:transform .25s var(--ease)}
.storeBtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.marquee{background:var(--accent);overflow:hidden;border-bottom:2px solid var(--ink)}
.track{display:flex;gap:40px;width:max-content;padding:8px 0;font-family:var(--display);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.track span{display:flex;align-items:center;gap:40px}
.track span::after{content:"";width:8px;height:8px;background:var(--ink);transform:rotate(45deg)}
.sheet{max-width:520px;padding:18px 18px 8px;max-height:min(80vh,680px)}
.sheet[open]{display:flex;flex-direction:column;gap:12px}
.sheetHead{display:flex;justify-content:space-between;align-items:center}
.sheetHead h3{font-family:var(--display);font-size:22px;margin:0}
.sheetHead .close{position:static}
.slist{overflow:auto;display:grid;gap:14px;padding-bottom:10px}
.city{display:grid;gap:6px}
.city h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sopt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.sopt:hover{border-color:var(--ink)}
.sopt span{display:grid;line-height:1.3}
.sopt small{color:var(--muted)}
.sopt[aria-pressed="true"]{background:var(--accent);border-color:var(--ink);font-weight:700}
.sopt .tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
.sopt[aria-pressed="true"] .tick{background:var(--ink);border-color:var(--ink)}
.sopt[aria-pressed="true"] .tick::after{content:"";width:6px;height:10px;border:solid var(--accent);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.store{cursor:pointer;text-align:left;font:inherit;color:inherit}
.store:hover{border-color:var(--ink)}
.store.mine{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--accent)}
.card,.chip,.btn,.size,.sopt,.store,.storeBtn{transition:transform .2s var(--ease),box-shadow .2s var(--ease),background-color .2s,border-color .2s,color .2s}
.card img{transition:transform .5s var(--ease)}
.ok{display:flex;gap:10px;align-items:flex-start}
.ok svg{flex:none}
@media (prefers-reduced-motion:no-preference){
  .track{animation:marq 28s linear infinite}
  @keyframes marq{to{transform:translateX(-50%)}}
  .card{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
  @keyframes rise{from{opacity:.001;transform:translateY(14px) scale(.98)}}
  .card:hover{transform:translateY(-4px);box-shadow:0 12px 26px -12px rgba(0,0,0,.28)}
  .card:hover img{transform:scale(1.05)}
  .card:hover .tag{animation:wig .4s var(--ease)}
  @keyframes wig{30%{transform:rotate(-4deg) scale(1.06)}60%{transform:rotate(3deg)}}
  .chip:active,.btn:active,.size:active,.sopt:active,.storeBtn:active{transform:scale(.96)}
  .btn:hover{box-shadow:0 6px 0 -1px var(--ink);transform:translateY(-2px)}
  dialog[open]{animation:pop .32s var(--ease)}
  dialog[open]::backdrop{animation:fade .3s ease}
  @keyframes pop{from{opacity:.001;transform:translateY(18px) scale(.97)}}
  @keyframes fade{from{opacity:0}}
  .hero h1{animation:rise .6s var(--ease) both}
  .hero p{animation:rise .6s var(--ease) .1s both}
  .where div{animation:slide .35s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms)}
  @keyframes slide{from{opacity:.001;transform:translateX(-10px)}}
  .ok{animation:rise .4s var(--ease) both}
  .ok path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .15s var(--ease) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .bump{animation:bump .5s var(--ease)}
  @keyframes bump{40%{transform:scale(1.06)}}
  .city{animation:rise .35s var(--ease) both;animation-delay:calc(var(--i,0) * 30ms)}
}
@media (max-width:640px){
  .logo img{height:42px}
  .storeBtn{order:3;flex:1 1 100%}
}

.filters{flex-wrap:nowrap;align-items:center}
.chips{flex:1;min-width:0}
.fbtn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;flex:none}
.fbtn[aria-expanded="true"]{background:var(--ink);color:var(--accent)}
.badge[hidden]{display:none}
main{grid-template-columns:minmax(0,1fr)}
.badge{background:var(--accent);color:var(--ink);border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;font-size:12px;padding:0 6px}
.fpanel{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.fpanel[hidden]{display:none}
.fpanel .field{min-width:180px}
.reset{border:0;background:none;text-decoration:underline;cursor:pointer;color:var(--muted);padding:8px 4px;margin-left:auto}
@media (max-width:640px){
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .filters{flex-direction:column;align-items:stretch}
  .fbtn{align-self:flex-start}
  .fpanel .field{flex:1 1 100%}
}
@media (prefers-reduced-motion:no-preference){
  .fpanel:not([hidden]){animation:rise .3s var(--ease)}
}

#catalog{scroll-margin-top:96px}
@media (max-width:640px){#catalog{scroll-margin-top:140px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{position:relative;border:0;padding:0;border-radius:18px;overflow:hidden;cursor:pointer;aspect-ratio:4/3;background:var(--ink);text-align:left;color:#fff}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease),opacity .3s}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.72))}
.tile .tl{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;display:grid;gap:2px}
.tile b{font-family:var(--display);font-size:clamp(22px,3vw,30px);line-height:1}
.tile small{font-size:13px;opacity:.9}
.tile.on{outline:4px solid var(--accent);outline-offset:-4px}
.tile.on b{color:var(--accent)}
.seg{position:relative;display:inline-flex;background:var(--surface);border:1.5px solid var(--ink);border-radius:999px;padding:4px;margin-bottom:14px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.segb{position:relative;z-index:1;border:0;background:none;padding:9px 18px;border-radius:999px;font-weight:800;cursor:pointer;white-space:nowrap;transition:color .25s}
.segb[aria-selected="true"]{color:var(--accent)}
.pill{position:absolute;top:4px;bottom:4px;left:4px;background:var(--ink);border-radius:999px;transition:transform .35s var(--ease),width .35s var(--ease)}
.price{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.new{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:var(--ink);color:var(--accent);border-radius:6px;padding:2px 7px}
@media (prefers-reduced-motion:no-preference){
  .tile{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0) * 80ms)}
  .tile:hover img{transform:scale(1.06)}
}
@media (max-width:640px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tile{aspect-ratio:3/4;border-radius:14px}
  .tile .tl{left:10px;right:10px;bottom:10px}
  .tile b{font-size:18px}
  .tile small{font-size:11px}
  .seg{display:flex}
  .segb{flex:1;padding:9px 10px}
}
</style>
</head>

const LETTER = ["XS","S","M","L","XL","XXL"], JEANS = ["28","30","32","34","36"], KIDS = ["98","110","122","134","146"];
const P = [
  {id:12, g:["f"], cat:"geci", img:"14577586", price:1099, ro:"Palton bej din stofă", ru:"Бежевое пальто", sizes:LETTER, isNew:1},
  {id:3, g:["m"], cat:"camasi", img:"9065153", price:349, ro:"Cămașă în carouri", ru:"Рубашка в клетку", sizes:LETTER},
  {id:17, g:["k"], cat:"tricouri", img:"5693888", price:219, ro:"Set tricou și pantaloni scurți", ru:"Комплект футболка и шорты", sizes:KIDS, isNew:1},
  {id:13, g:["f"], cat:"camasi", img:"5706275", price:299, ro:"Cămașă din in, culori naturale", ru:"Льняная рубашка, натуральные цвета", sizes:LETTER},
  {id:1, g:["m","f"], cat:"tricouri", img:"12039633", price:149, ro:"Tricou basic alb", ru:"Базовая белая футболка", sizes:LETTER},
  {id:18, g:["k"], cat:"tricouri", img:"7988711", price:129, ro:"Tricou cu buline pentru fete", ru:"Футболка в горошек для девочек", sizes:KIDS},
  {id:8, g:["f"], cat:"hanorace", img:"9594667", price:389, ro:"Hanorac bej oversize", ru:"Бежевое худи oversize", sizes:LETTER},
  {id:11, g:["m","f"], cat:"geci", img:"6045049", price:1199, ro:"Geacă de iarnă neagră", ru:"Чёрная зимняя куртка", sizes:LETTER},
  {id:14, g:["f"], cat:"rochii", img:"3998646", price:459, ro:"Rochie de vară cu flori", ru:"Летнее платье в цветочек", sizes:LETTER, isNew:1},
  {id:19, g:["k"], cat:"hanorace", img:"4964280", price:249, ro:"Pulover tricotat muștar", ru:"Вязаный свитер горчичного цвета", sizes:KIDS},
  {id:4, g:["m"], cat:"blugi", img:"8408556", price:399, ro:"Blugi gri slim", ru:"Серые джинсы slim", sizes:JEANS},
  {id:5, g:["f"], cat:"blugi", img:"17286040", price:429, ro:"Blugi deschiși, croială dreaptă", ru:"Светлые прямые джинсы", sizes:JEANS},
  {id:15, g:["f"], cat:"camasi", img:"4641825", price:279, ro:"Bluză crem, croială lejeră", ru:"Кремовая блузка свободного кроя", sizes:LETTER},
  {id:2, g:["m"], cat:"tricouri", img:"7432216", price:169, ro:"Tricou cu decolteu în V", ru:"Футболка с V-вырезом", sizes:LETTER},
  {id:6, g:["m","f"], cat:"blugi", img:"1082529", price:449, ro:"Blugi clasici albaștri", ru:"Классические синие джинсы", sizes:JEANS},
  {id:9, g:["f"], cat:"hanorace", img:"9594679", price:389, ro:"Hanorac verde mentă", ru:"Худи мятного цвета", sizes:LETTER},
  {id:7, g:["m"], cat:"blugi", img:"2129970", price:459, ro:"Blugi închiși straight", ru:"Тёмные джинсы straight", sizes:JEANS},
  {id:10, g:["m"], cat:"geci", img:"7679725", price:899, ro:"Geacă din piele ecologică", ru:"Куртка из экокожи", sizes:LETTER}
];
const S = [
  ["Chișinău","Botanica","bd. Dacia 21"],["Chișinău","Centru","str. Ștefan cel Mare 98"],["Chișinău","Ciocana","bd. Mircea cel Bătrân 15"],
  ["Chișinău","Râșcani","bd. Moscova 7"],["Chișinău","Buiucani","str. Alba Iulia 75"],["Bălți","Centru","str. Independenței 18"],
  ["Bălți","Dacia","str. Ștefan cel Mare 120"],["Orhei","","str. Vasile Lupu 33"],["Soroca","","str. Independenței 40"],
  ["Cahul","","str. Republicii 12"],["Ungheni","","str. Națională 25"],["Edineț","","str. Independenței 61"],
  ["Drochia","","bd. Independenței 9"],["Fălești","","str. Ștefan cel Mare 44"],["Hîncești","","str. Mihalcea Hîncu 120"],
  ["Comrat","","str. Lenin 150"],["Strășeni","","str. Ștefan cel Mare 3"],["Florești","","str. Ștefan cel Mare 56"],
  ["Rîșcani","","str. Independenței 27"],["Glodeni","","str. Suveranității 11"]
].map((s,i)=>({id:i, city:s[0], area:s[1], addr:s[2], phone:"+373 "+(i<5?"22":"231")+" 00 0"+String(i+10).slice(-2)}));
function storeName(s){return s.city+(s.area?" "+s.area:"");}

/* Stocks: same product, separate quantity per store and size */
function rnd(seed){let h=(seed*2654435761)>>>0;h^=h>>>15;h=Math.imul(h,2246822519)>>>0;h^=h>>>13;h=Math.imul(h,3266489917)>>>0;h^=h>>>16;return (h>>>0)/4294967296;}
const STOCK = {};
P.forEach(p=>{STOCK[p.id]={};p.sizes.forEach((z,zi)=>{STOCK[p.id][z]=S.map(s=>{const r=rnd(p.id*977+zi*131+s.id*17+3);return r<0.5?0:Math.ceil(r*8-3.5)>0?Math.ceil(r*8-3.5):1;});});});
/* one size sold out everywhere, to show the state */
STOCK[3]["XS"]=S.map(()=>0);

let st = {gender:"all", lang:"ro", store:5, cat:"all", size:"", sort:"pop", onlyMine:false};
try{const saved=JSON.parse(localStorage.getItem("minipret-demo")||"{}");Object.assign(st,saved);}catch(e){}
function save(){try{localStorage.setItem("minipret-demo",JSON.stringify({lang:st.lang,store:st.store}));}catch(e){}}
const $=id=>document.getElementById(id);
const t=k=>T[st.lang][k];

function render(){
  document.documentElement.lang=st.lang;
  $("lRo").setAttribute("aria-pressed",st.lang==="ro");$("lRu").setAttribute("aria-pressed",st.lang==="ru");
  $("demoBar").textContent=t("demo");$("storeLbl").textContent=t("store");$("heroT").textContent=t("hero");$("heroP").textContent=t("heroP");
  $("sizeLbl").textContent=t("size");$("sortLbl").textContent=t("sort");$("onlyMineT").textContent=t("onlyMine");
  $("foot").textContent=t("foot");$("closeBtn").setAttribute("aria-label",t("close"));
  $("storeName").textContent=storeName(S[st.store]);
  const m=t("marq").map(x=>`<span>${x}</span>`).join("");$("marq").innerHTML=m+m+m+m;
  $("sdT").textContent=t("pickStore");$("sdSearchL").textContent=t("search");$("sdClose").setAttribute("aria-label",t("close"));
  const inGen=P.filter(p=>st.gender==="all"||p.g.includes(st.gender));
  const allSizes=[...LETTER,...JEANS,...KIDS].filter(z=>inGen.some(p=>p.sizes.includes(z)));
  if(st.size&&!allSizes.includes(st.size)) st.size="";
  $("genT").textContent=t("forWho");
  $("tiles").innerHTML=GEN.map((g,i)=>{const n=P.filter(p=>p.g.includes(g.id)).length;return `<button type="button" class="tile${st.gender===g.id?" on":""}" data-gen="${g.id}" style="--i:${i}"><img src="${IMG[g.img]}" alt=""><span class="tl"><b>${g[st.lang]}</b><small>${t("items")(n)} · ${t("seeAll")} →</small></span></button>`;}).join("");
  const tabs=[{id:"all",ro:T.ro.genAll,ru:T.ru.genAll},...GEN];
  $("seg").innerHTML=`<i class="pill" id="segPill"></i>`+tabs.map(g=>`<button type="button" role="tab" class="segb" data-gen="${g.id}" aria-selected="${st.gender===g.id}">${g[st.lang]}</button>`).join("");
  requestAnimationFrame(movePill);
  $("sizeSel").innerHTML=`<option value="">${t("anySize")}</option>`+allSizes.map(z=>`<option${z===st.size?" selected":""}>${z}</option>`).join("");
  $("sortSel").innerHTML=[["pop",t("sPop")],["asc",t("sAsc")],["desc",t("sDesc")]].map(([v,l])=>`<option value="${v}"${v===st.sort?" selected":""}>${l}</option>`).join("");
  $("onlyMine").checked=st.onlyMine;$("fBtnT").textContent=t("filters");$("fReset").textContent=t("reset");
  const catsHere=CATS.filter(c=>inGen.some(p=>p.cat===c.id));
  if(st.cat!=="all"&&!catsHere.some(c=>c.id===st.cat)) st.cat="all";
  $("cats").innerHTML=[{id:"all",ro:T.ro.all,ru:T.ru.all},...catsHere].map(c=>`<button type="button" class="chip" data-cat="${c.id}" aria-pressed="${c.id===st.cat}">${c[st.lang]}</button>`).join("");
  renderGrid();
}
function sizesIn(p,storeId){return p.sizes.filter(z=>STOCK[p.id][z][storeId]>0);}
function storesWith(p){return S.filter(s=>p.sizes.some(z=>STOCK[p.id][z][s.id]>0)).length;}
function renderGrid(){
  const nf=(st.size?1:0)+(st.sort!=="pop"?1:0)+(st.onlyMine?1:0);$("fBadge").hidden=!nf;$("fBadge").textContent=nf;
  let list=P.filter(p=>(st.gender==="all"||p.g.includes(st.gender))&&(st.cat==="all"||p.cat===st.cat));
  if(st.size) list=list.filter(p=>p.sizes.includes(st.size)&&(st.onlyMine?STOCK[p.id][st.size][st.store]>0:STOCK[p.id][st.size].some(q=>q>0)));
  if(st.onlyMine) list=list.filter(p=>sizesIn(p,st.store).length>0);
  if(st.sort==="asc") list=[...list].sort((a,b)=>a.price-b.price);
  if(st.sort==="desc") list=[...list].sort((a,b)=>b.price-a.price);
  $("count").textContent=t("found")(list.length);
  if(!list.length){$("grid").innerHTML=`<div class="empty" style="grid-column:1/-1">${t("none")}</div>`;return;}
  $("grid").innerHTML=list.map((p,i)=>{
    const n=sizesIn(p,st.store).length;
    const av=n?`<div class="avail"><span class="dot"></span>${t("inMine")(n)}</div>`:`<div class="avail none"><span class="dot"></span>${t("notMine")} · ${t("inStores")(storesWith(p))}</div>`;
    return `<button type="button" class="card" data-id="${p.id}" style="--i:${i}"><img src="${IMG[p.img]}" alt="${p[st.lang]}" loading="lazy"><div class="info"><div class="name">${p[st.lang]}</div><div class="price"><span class="tag">${p.price} ${t("lei")}</span>${p.isNew?`<span class="new">${t("newTag")}</span>`:""}</div>${av}</div></button>`;
  }).join("");
}

let cur=null, curSize=null;
function openP(id){
  cur=P.find(p=>p.id==id);
  const mineSizes=sizesIn(cur,st.store);
  curSize=st.size&&cur.sizes.includes(st.size)?st.size:(mineSizes[0]||cur.sizes.find(z=>STOCK[cur.id][z].some(q=>q>0)));
  $("pdImg").src=IMG[cur.img];$("pdImg").alt=cur[st.lang];
  $("pdName").textContent=cur[st.lang];$("pdPrice").innerHTML=`<span class="tag">${cur.price} ${t("lei")}</span>`;
  $("pdSizeT").textContent=t("pickSize");
  renderPD();
  if(typeof $("dlg").showModal==="function") $("dlg").showModal(); else $("dlg").setAttribute("open","");
}
function renderPD(){
  $("pdSizes").innerHTML=cur.sizes.map(z=>{const any=STOCK[cur.id][z].some(q=>q>0);return `<button type="button" class="size${any?"":" out"}" data-size="${z}" aria-pressed="${z===curSize}">${z}</button>`;}).join("");
  const q=STOCK[cur.id][curSize];
  const rows=S.map(s=>({s,n:q[s.id]})).filter(r=>r.n>0).sort((a,b)=>(b.s.id==st.store)-(a.s.id==st.store));
  $("pdWhereT").textContent=t("where")(curSize);
  $("pdWhere").innerHTML=rows.length?rows.map((r,i)=>`<div class="${r.s.id==st.store?"mine":""}" style="--i:${i}"><span>${storeName(r.s)}</span><span class="qty">${t("pcs")(r.n)}</span></div>`).join(""):`<div><span>${t("nowhere")}</span></div>`;
  const here=q[st.store]>0, sn=storeName(S[st.store]);
  $("pdAction").innerHTML=`<button class="btn" type="button" id="resBtn"${here?"":" disabled"}>${t("reserve")(sn)}</button>${here?"":`<p class="note">${t("notHere")}</p>`}`;
  const b=$("resBtn"); if(here) b.onclick=showForm;
}
function showForm(){
  $("pdAction").innerHTML=`<form id="resForm" novalidate>
    <div class="field"><label for="rName">${t("name")}</label><input type="text" id="rName" autocomplete="name"></div>
    <div class="field"><label for="rPhone">${t("phone")}</label><input type="tel" id="rPhone" autocomplete="tel" placeholder="069 123 456"></div>
    <p class="note" id="rErr" role="alert"></p>
    <button class="btn" type="submit">${t("send")}</button></form>`;
  $("rName").focus();
  $("resForm").onsubmit=e=>{e.preventDefault();
    const nm=$("rName").value.trim(), ph=$("rPhone").value.replace(/\D/g,"");
    if(!nm){$("rErr").textContent=t("errName");return;}
    if(ph.length<8){$("rErr").textContent=t("errPhone");return;}
    $("pdAction").innerHTML=`<div class="ok"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="var(--ok)"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${t("sent")(cur[st.lang],curSize,storeName(S[st.store]))}</span></div><p class="note">${t("demoNote")}</p>`;
  };
}

function movePill(){const a=document.querySelector('.segb[aria-selected="true"]'),p=$("segPill");if(!a||!p)return;p.style.width=a.offsetWidth+"px";p.style.transform=`translateX(${a.offsetLeft-4}px)`;}
window.addEventListener("resize",movePill);
function setGender(g,scroll){st.gender=g;st.cat="all";render();if(scroll)$("catalog").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});}
document.addEventListener("click",e=>{
  const tl=e.target.closest(".tile"); if(tl){setGender(tl.dataset.gen,true);return;}
  const sb=e.target.closest(".segb"); if(sb){setGender(sb.dataset.gen,false);return;}
  const c=e.target.closest(".chip"); if(c){st.cat=c.dataset.cat;render();return;}
  const card=e.target.closest(".card"); if(card){openP(card.dataset.id);return;}
  const sz=e.target.closest(".size"); if(sz){curSize=sz.dataset.size;renderPD();return;}
  const op=e.target.closest(".sopt"); if(op){pickStore(op.dataset.pick);$("storeDlg").close();return;}
});
$("fBtn").onclick=()=>{const p=$("fPanel"),o=p.hidden;p.hidden=!o;$("fBtn").setAttribute("aria-expanded",o);};
$("fReset").onclick=()=>{st.size="";st.sort="pop";st.onlyMine=false;render();};
$("lRo").onclick=()=>{st.lang="ro";save();render();};
$("lRu").onclick=()=>{st.lang="ru";save();render();};
function renderStoreList(){
  const q=$("sdSearch").value.trim().toLowerCase();
  const fit=S.filter(s=>!q||(storeName(s)+" "+s.addr).toLowerCase().includes(q));
  const cities=[...new Set(fit.map(s=>s.city))];
  $("sdList").innerHTML=cities.length?cities.map((c,i)=>`<div class="city" style="--i:${i}"><h4>${c}</h4>${fit.filter(s=>s.city===c).map(s=>`<button type="button" class="sopt" data-pick="${s.id}" aria-pressed="${s.id==st.store}"><span><b>${s.area||c}</b><small>${s.addr} · ${t("hours")}</small></span><i class="tick"></i></button>`).join("")}</div>`).join(""):`<p class="note">${t("none")}</p>`;
}
function openStores(){$("sdSearch").value="";renderStoreList();$("storeBtn").setAttribute("aria-expanded","true");$("storeDlg").showModal();}
function pickStore(id){
  st.store=+id;save();$("storeName").textContent=storeName(S[st.store]);
  const b=$("storeBtn");b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump");
  renderGrid();
}
$("storeBtn").onclick=openStores;
$("sdSearch").oninput=renderStoreList;
$("sdClose").onclick=()=>$("storeDlg").close();
$("storeDlg").addEventListener("close",()=>$("storeBtn").setAttribute("aria-expanded","false"));
$("storeDlg").addEventListener("click",e=>{if(e.target===$("storeDlg"))$("storeDlg").close();});
$("sizeSel").onchange=e=>{st.size=e.target.value;renderGrid();};
$("sortSel").onchange=e=>{st.sort=e.target.value;renderGrid();};
$("onlyMine").onchange=e=>{st.onlyMine=e.target.checked;renderGrid();};
$("closeBtn").onclick=()=>$("dlg").close?$("dlg").close():$("dlg").removeAttribute("open");
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close();});
render();
</script>
</body>
</html>
